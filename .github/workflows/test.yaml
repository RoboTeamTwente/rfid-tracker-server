name: Test
on:
  push:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:debian@sha256:49f68aaf4290a1eb438d913d51033007eb5fac1e3add6ca8d1d161426ddac798
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cd door_tracker && uv sync --locked --no-progress
      - run: cd door_tracker && uv run manage.py test --noinput
