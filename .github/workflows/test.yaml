name: Test
on:
  push:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:debian@sha256:477cd3e9492fa6199f4d524198fa75ec03f1c7a64c566cdc7e05fe290042fa3a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cd door_tracker && uv sync --locked --no-progress
      - run: cd door_tracker && uv run manage.py test --noinput
