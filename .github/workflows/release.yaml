name: Release
on:
  push:
    tags:
      - v*
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  parse-version:
    name: Parse this release's version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          version="${GITHUB_REF_NAME#v}"
          echo "patch=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${version%.*.*}" >> "$GITHUB_OUTPUT"
  upload-dockerhub:
    name: Build & upload the container image to Dockerhub
    runs-on: ubuntu
    needs: parse-version
    steps:
      - uses: docker/login-action@v4
        with:
          username: RoboTeamTwente
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: '{{defaultContext}}:door_tracker'
          push: true
          tags: |
            docker.io/roboteamtwente/rfid-tracker-serve:{{ needs.parse-version.outputs.patch }} \
            docker.io/roboteamtwente/rfid-tracker-serve:{{ needs.parse-version.outputs.minor }} \
            docker.io/roboteamtwente/rfid-tracker-serve:{{ needs.parse-version.outputs.major }} \
            docker.io/roboteamtwente/rfid-tracker-serve:latest
      - run: just upload-image
  release:
    name: Create a Github release
    runs-on: ubuntu
    needs: upload-dockerhub
    steps:
      - run: gh release new "$CI_COMMIT_TAG" --notes "$(git cliff --latest --strip all)"
